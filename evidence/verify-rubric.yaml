rubrics:
  - id: 1
    type: f2p
    text: "并发清理请求中只有当前执行代次能够删除日志，其他请求不会产生删除或 vacuum 副作用。"
  - id: 2
    type: f2p
    text: "请求取消或 server 实例退出后，未完成清理的所有权可安全过期并由后续请求接管，旧实例恢复后不能继续写入或释放新锁。"
  - id: 3
    type: f2p
    text: "分区或批次在部分删除后失败时，重试从持久化进度继续，不遗漏记录、不重复计数，并返回准确的删除数和受影响分区。"
  - id: 4
    type: f2p
    text: "PostgreSQL 连接变化和 SQLite 进程重启下的锁归属都可验证，不会出现错误解锁或永久残留的 active 占位。"
  - id: 5
    type: f2p
    text: "vacuum 仅由完成删除阶段的当前所有者执行；vacuum 失败不会丢失删除进度，后续重试可确定收敛。"
  - id: 6
    type: p2p
    text: "正常串行清理、非分区模式、无匹配日志、时间与批大小校验及 vacuum 关闭时的响应保持既有行为。"
